<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GeoBaches — Reportar un bache</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6E4A}a:hover{color:#2C5236}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #1D2420; background: #ECE8DF">

<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<defs>
<pattern id="calles3" width="80" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
<path d="M0 0H80M0 0V70" stroke="#FFFFFF" stroke-width="7" fill="none"></path>
</pattern>
</defs>
<rect width="390" height="844" fill="#ECE8DF"></rect>
<rect width="390" height="844" fill="url(#calles3)"></rect>
<rect x="250" y="140" width="110" height="80" rx="10" fill="#D3E5C8"></rect>
<path d="M60 -10 L 30 860" stroke="#F3D27A" stroke-width="13" fill="none"></path>
<g font-family="DM Sans, sans-serif" font-size="12" fill="#7A776F">
<text x="230" y="250">Residencial San Carlos</text>
</g>
</svg>

<div aria-hidden="true" style="position: absolute; left: 175px; top: 150px; display: flex; flex-direction: column; align-items: center">
<div style="width: 40px; height: 40px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #3F6E4A; border: 3px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,.3); box-sizing: border-box; display: flex; align-items: center; justify-content: center"><div style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></div></div>
<div style="width: 10px; height: 4px; border-radius: 50%; background: rgba(0,0,0,.25); margin-top: 6px"></div>
</div>
<div style="position: absolute; left: 50%; top: 96px; transform: translateX(-50%); background: #1D2420; color: #FFFFFF; font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 10px; white-space: nowrap">Mové el mapa hasta el bache</div>

<a href="Main.dc.html" aria-label="Cancelar reporte" style="position: absolute; top: 14px; left: 14px; width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 14px rgba(29,36,32,.18); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2420" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ sheetH }}px; overflow: hidden; transition: height .25s ease; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(29,36,32,.14); display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 24px; box-sizing: border-box">
<button aria-expanded="{{ expanded }}" aria-label="{{ toggleLabel }}" onClick="{{ toggle }}" style="flex-shrink: 0; align-self: center; width: 64px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: #F2F0EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B413D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ chevStyle }}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Nuevo reporte</h1>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F2F0EA">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6E4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">Ansenusa 2840</span>
<span style="font-size: 13px; color: #5E655F">Residencial San Carlos</span>
</div>
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700">¿Qué tan grave es?</legend>
<sc-for list="{{ niveles }}" as="n" hint-placeholder-count="3">
<button aria-pressed="{{ n.pressed }}" onClick="{{ n.pick }}" style="{{ n.cardStyle }}">
<span aria-hidden="true" style="{{ n.iconStyle }}">{{ n.num }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left">
<span style="font-size: 16px; font-weight: 700; color: #1D2420">{{ n.nombre }}</span>
<span style="font-size: 13px; color: #5E655F; line-height: 1.35">{{ n.desc }}</span>
</span>
</button>
</sc-for>
</fieldset>

<button style="height: 48px; border: 1.5px dashed #BDB8AD; border-radius: 14px; background: #FFFFFF; color: #1D2420; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Agregar foto (opcional)
</button>

<button style="height: 54px; margin-top: auto; border: 0; border-radius: 16px; background: #3F6E4A; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Enviar reporte</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 2, open: true };
}
renderVals() {
const defs = [
{ num: 1, nombre: 'Leve', desc: 'Se ve de lejos y se puede esquivar sin frenar.', fill: '#F2B53A', ink: '#3D2A00', tint: '#FDF1D6' },
{ num: 2, nombre: 'Rompe autos', desc: 'Golpe fuerte: riesgo para cubiertas, llantas y tren delantero.', fill: '#C2531A', ink: '#FFFFFF', tint: '#FBE4D6' },
{ num: 3, nombre: 'Cráter', desc: 'Profundo o difícil de ver. Peligro real para motos y bicis.', fill: '#9E1C1C', ink: '#FFFFFF', tint: '#F8DADA' }
];
const picked = this.state.picked;
const open = this.state.open;
return {
sheetH: open ? 580 : 190,
expanded: open ? 'true' : 'false',
toggleLabel: open ? 'Ocultar formulario' : 'Mostrar formulario',
toggle: () => this.setState({ open: !this.state.open }),
chevStyle: 'transition: transform .25s ease; transform: rotate(' + (open ? 0 : 180) + 'deg);',
niveles: defs.map((d) => {
const on = d.num === picked;
return {
num: d.num,
nombre: d.nombre,
desc: d.desc,
pressed: on ? 'true' : 'false',
pick: () => this.setState({ picked: d.num }),
cardStyle: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 14px; cursor: pointer; font-family: inherit; box-sizing: border-box; background: ' + (on ? d.tint : '#FFFFFF') + '; border: 2px solid ' + (on ? d.fill : '#E4E1D9') + ';',
iconStyle: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; background: ' + d.fill + '; color: ' + d.ink + ';'
};
})
};
}
}
</script>
</body>
</html>
