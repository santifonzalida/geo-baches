<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: true };
}
renderVals() {
const open = this.state.open;
const sheetH = open ? 290 : 88;
return {
sheetH: sheetH,
fabBottom: sheetH + 16,
locateBottom: sheetH + 84,
expanded: open ? 'true' : 'false',
toggleLabel: open ? 'Ocultar reportes recientes' : 'Mostrar reportes recientes',
toggle: () => this.setState({ open: !this.state.open }),
chevStyle: 'transition: transform .25s ease; transform: rotate(' + (open ? 0 : 180) + 'deg);'
};
}
}
