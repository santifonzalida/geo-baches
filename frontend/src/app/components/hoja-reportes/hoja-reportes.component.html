<div class="flex h-full flex-col">
  <div class="flex items-center justify-between gap-3 pt-[18px] pr-4 pb-2 pl-5">
    <div class="flex min-w-0 flex-col gap-0.5">
      <h1 class="m-0 font-sans text-[19px] font-bold tracking-[-0.01em] text-tinta">Reportes recientes</h1>
      <p class="m-0 text-[13px] text-apagado">{{ subtitulo() }}</p>
    </div>
    <button
      type="button"
      class="flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-full border-0 bg-superficie p-0"
      [attr.aria-expanded]="abierta()"
      [attr.aria-label]="abierta() ? 'Ocultar reportes recientes' : 'Mostrar reportes recientes'"
      (click)="abierta.set(!abierta())"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#3B413D"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="transition-transform duration-250 ease-in-out"
        [class.rotate-180]="!abierta()"
      >
        <path d="M6 9l6 6 6-6"></path>
      </svg>
    </button>
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto pb-2">
    @for (bache of reportes(); track bache.id; let primero = $first) {
      @if (!primero) {
        <div aria-hidden="true" class="mr-5 ml-[72px] h-px bg-separador"></div>
      }
      <button
        type="button"
        class="flex min-h-16 w-full cursor-pointer items-center gap-3 border-0 bg-transparent px-5 py-2.5 text-left text-tinta hover:bg-superficie/60"
        (click)="seleccionar.emit(bache)"
      >
        <div
          aria-hidden="true"
          class="flex size-10 shrink-0 items-center justify-center rounded-xl text-[15px] font-bold"
          [style.background]="nivel(bache).fondo"
          [style.color]="nivel(bache).texto"
        >
          {{ nivel(bache).nivel }}
        </div>
        <div class="flex min-w-0 flex-1 flex-col gap-[3px]">
          <span class="truncate text-base font-bold">{{ direccion(bache) }}</span>
          <span class="truncate text-[13px] text-apagado">
            <span class="font-bold" [style.color]="nivel(bache).texto">{{ nivel(bache).etiqueta }}</span>
            {{ bache.barrio ? ' · ' + bache.barrio : '' }} · {{ hace(bache) }}
          </span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8F8A" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M9 6l6 6-6 6"></path>
        </svg>
      </button>
    } @empty {
      <p class="m-0 px-5 py-4 text-sm text-apagado">No hay reportes con estos filtros en esta zona. Mové el mapa o cambiá los filtros.</p>
    }
  </div>
</div>
